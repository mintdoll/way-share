<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WayShare — карта</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js" defer></script>
</head>
<body>
<header class="site-header">
  <a class="logo" href="index.html">WayShare</a>
  <nav class="main-navigation" aria-label="Основная навигация">
    <a href="index.html">Главная</a>
    <a href="map.html" aria-current="page">Карта</a>
    <a href="create-route.html">Создать маршрут</a>
    <a href="profile.html">Профиль</a>
  </nav>
  <button class="menu-button" type="button">Меню</button>
</header>

<main>
  <section class="section">
    <p class="eyebrow">Исследуй город</p>
    <h1>Маршруты на карте</h1>

    <div class="filters">
      <label>
        Поиск
        <input id="map-search" type="search" placeholder="Название маршрута">
      </label>

      <label>
        Категория
        <select id="map-category">
          <option value="all">Все</option>
          <option value="walk">Прогулка</option>
          <option value="food">Еда</option>
          <option value="culture">Культура</option>
          <option value="nature">Природа</option>
        </select>
      </label>
    </div>

    <div class="map-layout">
      <div>
        <h2>Маршруты</h2>
        <div class="route-list" id="map-routes"></div>
      </div>

      <div class="empty-map">
        <p>Здесь будет карта</p>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <a class="logo" href="index.html">WayShare</a>
  <p>Социальная сеть маршрутов и личного опыта.</p>
</footer>
</body>
</html>
