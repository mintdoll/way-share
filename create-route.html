<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WayShare — создать маршрут</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js" defer></script>
</head>
<body>
<header class="site-header">
  <a class="logo" href="index.html">WayShare</a>
  <nav class="main-navigation" aria-label="Основная навигация">
    <a href="index.html">Главная</a>
    <a href="map.html">Карта</a>
    <a href="create-route.html" aria-current="page">Создать маршрут</a>
    <a href="profile.html">Профиль</a>
  </nav>
  <button class="menu-button" type="button">Меню</button>
</header>

<main>
  <section class="section form-section">
    <p class="eyebrow">Новый маршрут</p>
    <h1>Создать маршрут</h1>
    <p class="muted">Поделись местами, которые тебе нравятся, и помоги другим открыть город.</p>

    <form id="route-form">
      <div class="form-grid">
        <label class="wide">Название маршрута
          <input id="route-title" type="text" minlength="5" required placeholder="Например, Тихий вечер у Ангары">
        </label>

        <label>Начальная точка
          <input id="route-location" type="text" minlength="3" required placeholder="Например, Нижняя набережная">
        </label>

        <label>Категория
          <select id="route-category" required>
            <option value="">Выбери категорию</option>
            <option value="walk">Прогулка</option>
            <option value="food">Еда</option>
            <option value="culture">Культура</option>
            <option value="nature">Природа</option>
          </select>
        </label>

        <label>Бюджет, ₽
          <input id="route-budget" type="number" min="0" max="50000" required placeholder="1000">
        </label>

        <label>Длительность, ч
          <input id="route-duration" type="number" min="1" max="24" required placeholder="3">
        </label>
      </div>

      <fieldset>
        <legend>Для кого этот маршрут?</legend>
        <label><input type="radio" name="format" value="solo" required> В одиночестве</label>
        <label><input type="radio" name="format" value="friends"> С друзьями</label>
        <label><input type="radio" name="format" value="family"> С семьёй</label>
      </fieldset>

      <label>Описание маршрута
        <textarea id="route-description" minlength="20" maxlength="500" required placeholder="Расскажи, куда идти и что посмотреть."></textarea>
      </label>

      <label>Обложка
        <input type="file" accept="image/png,image/jpeg">
      </label>

      <label class="check">
        <input id="route-public" type="checkbox" checked>
        Опубликовать маршрут для сообщества
      </label>

      <p id="form-message" class="form-message" aria-live="polite"></p>

      <div class="actions">
        <a class="secondary-button" href="index.html">Отмена</a>
        <button class="primary-button" type="submit">Создать маршрут</button>
      </div>
    </form>
  </section>
</main>

<footer class="site-footer">
  <a class="logo" href="index.html">WayShare</a>
  <p>Социальная сеть маршрутов и личного опыта.</p>
</footer>
</body>
</html>
